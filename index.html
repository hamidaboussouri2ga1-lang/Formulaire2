<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cahier des charges</title>
  </head>
  <body>
    <form action="/traitement" method="POST" enctype="multipart/form-data">
      <fieldset>
        <legend>Identité et Sécurité</legend>
        <input type="hidden" name="source" value="inscription_web" />
        <label for="prenom">Prenom:</label>
        <input type="text" id="prenom" name="prenom" required autofocus /><br />
        <label for="nom">Nom:</label>
        <input
          type="text"
          id="nom"
          name="nom"
          required
          placeholder="DUPONT"
        /><br />
        <label for="mot-de-passe">Mot de passe:</label>
        <input
          type="password"
          id="mot-de-passe"
          name="mot-de-passe"
          required
          minlength="8"
        /><br />
        <label for="photo">Photo de profil:</label>
        <input type="file" id="photo" name="photo" accept=".png, .jpg" /><br />
      </fieldset>
      <fieldset>
        <legend>Contact et Profil</legend>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required /><br />
        <label for="telephone">Téléphone:</label>
        <input
          type="tel"
          id="telephone"
          name="telephone"
          required
          pattern="[0-9]{10}"
        /><br />
        <label for="url">Site Web:</label>
        <input type="url" id="url" name="URL" /><br />
        <label for="color">Couleur du thème:</label>
        <input type="color" id="color" name="color" value="#3498db" /><br />
      </fieldset>
      <fieldset>
        <legend>Informations professionnelles</legend>
        <label for="Experience">Années d'experience:</label>
        <input
          type="number"
          id="Experience"
          name="Experience"
          min="0"
          max="50"
        /><br />
        <label for="tjm">Taux Journaliers Moyen:</label>
        <input type="range" id="tjm" name="tjm" min="0" step="50" /><br />
        <label for="seniorite">Niveau de seniorité estimé:</label>
        <input
          type="range"
          id="seniorite"
          name="seniorite"
          min="1"
          max="5"
        /><br />
        <p>Langages maitrisés:</p>
        <input
          type="checkbox"
          id="html"
          name="langages[]"
          value="HTML"
          checked
        />
      </fieldset>
      <label for="html">HTML</label><br />
      <input type="checkbox" id="html" name="langages[]" value="html" />
      <label for="css">CSS</label><br />
      <input type="checkbox" id="css" name="langages[]" value="css" />
      <label for="javascript">JavaScript</label><br />
      <input
        type="checkbox"
        id="javascript"
        name="langages[]"
        value="javascript"
      />
      <label for="php">PHP </label><br />
      <input type="checkbox" id="php" name="langages[]" value="php" />
      <p>Statut Juridique:</p>
      <input type="radio" id="auto" name="statut" value="auto-entrepreneur" />
      <label for="auto">Auto-entrepreneur</label>
      <input type="radio" id="sasu" name="statut" value="sasu" />
      <label for="sasu">SASU </label>
      <input type="radio" id="eurl" name="statut" value="eurl" /><br />
      <label for="eurl">EURL </label><br />
      <label for="region">Région d'intervention:</label>
      <select id="region" name="region">
        <optgroup label="Groupe Nord">
          <option value="Hauts-de-France">Hauts-de-France</option>
          <option value="Normandie">Normandie</option>
          <option value="ile-de-france">Île-de-France</option>
        </optgroup>
        <optgroup label="Groupe Sud">
          <option value="Occitanie">Occitanie</option>
          <option value="paca">Provence-Alpes-Côte d'Azur</option>
          <option value="Nouvelle-Aquitaine">Nouvelle-Aquitaine</option>
        </optgroup></select
      ><br />
      <fieldset>
        <legend>Disponibilités et Finalisation</legend>
        <label for="disponibilites">Date de Disponibilités:</label>
        <input
          type="date"
          id="disponibilites"
          name="disponibilites"
          required
        /><br />
        <label for="audit">Dernier audit technique:</label>
        <input
          type="text"
          id="audit"
          name="audit"
          value="Non réalisé"
          readonly
        /><br />
        <label for="motivation">motivation:</label><br />
        <textarea
          id="motivation"
          name="motivation"
          rows="8"
          maxlength="500"
        ></textarea
        ><br />
        <input type="checkbox" id="cgu" name="cgu" required />
        <label for="cgu">J'accepte les conditions d'utilisation</label><br />
        <button type="submit">Envoyer</button>
        <button type="reset">Tout effacer</button>
      </fieldset>
    </form>
  </body>
</html>
